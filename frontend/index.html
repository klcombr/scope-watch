    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O que é scope creep?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Scope creep é a expansão gradual e não controlada do escopo de um projeto, geralmente causada por pedidos extras do cliente que não foram previstos no contrato original. Sem controle, resulta em trabalho adicional não cobrado e prazos estourados."
          }
        },
        {
          "@type": "Question",
          "name": "Como evitar trabalho fora do escopo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Documente o escopo desde o início, registre todos os pedidos do cliente, classifique o que está dentro e fora do acordado, e crie change orders formais para cobrar trabalho adicional. O Scopewise automatiza esse processo."
          }
        },
        {
          "@type": "Question",
          "name": "Como cobrar alterações fora do escopo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ao registrar um pedido fora do escopo, crie uma change order estimando horas e valor. Envie ao cliente para aprovação. Só inicie o trabalho após aprovação formal. O Scopewise facilita todo esse fluxo."
          }
        },
        {
          "@type": "Question",
          "name": "O que é uma change order?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Uma change order é um documento formal que descreve uma alteração no escopo do projeto, incluindo descrição do trabalho, horas estimadas, valor/hora e total. É enviada ao cliente para aprovação antes do início do trabalho."
          }
        },
        {
          "@type": "Question",
          "name": "O Scopewise é gratuito?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O Scopewise oferece um plano gratuito com até 3 projetos ativos e todas as funcionalidades core. Não há limite de funcionalidades no plano gratuito."
          }
        },
        {
          "@type": "Question",
          "name": "Para quem é o Scopewise?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Freelancers e pequenas agências que trabalham com projetos sob demanda e precisam controlar pedidos extras do cliente, evitar trabalho não pago e profissionalizar a cobrança por alterações."
          }
        }
      ]
    }
    </script>
